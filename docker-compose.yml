services:
  ollama:
    image: ollama/ollama:latest
    container_name: vocechatbot-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Uncomment below if you have an NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  vocechatbot:
    build: .
    image: ghcr.io/${GITHUB_OWNER:-yourname}/${GITHUB_REPO:-vocechatbot}:latest
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - CONFIG_PATH=/app/config.yaml
      - GENERAL_BOT_API_KEY
      - JELLYFIN_BOT_API_KEY
      - JELLYSEERR_BOT_API_KEY
      - JELLYSEERR_API_KEY
      - JELLYFIN_API_KEY
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ollama_data:
